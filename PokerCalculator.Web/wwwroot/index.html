<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Poker Equity Calculator</title>
  <meta name="description" content="Free Texas Hold'em and Omaha poker equity calculator. Compute win/loss/tie odds against one or more villain ranges using Monte Carlo simulation." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="felt">
    <main class="table">
      <header class="table-header">
        <h1><span class="suit red">&hearts;</span> Poker Equity Calculator <span class="suit black">&spades;</span></h1>

        <div class="game-toggle" role="radiogroup" aria-label="Game">
          <input type="radio" id="game-holdem" name="game" value="Holdem" checked>
          <label for="game-holdem">Hold'em</label>
          <input type="radio" id="game-omaha" name="game" value="Omaha">
          <label for="game-omaha">Omaha</label>
        </div>
      </header>

      <form id="equity-form" novalidate>
        <div class="field">
          <div class="section-header">
            <label>Cards</label>
            <div class="picker-toggle" id="picker-toggle" role="radiogroup" aria-label="Selecting cards for">
              <button type="button" class="picker-toggle-btn active" data-target="hero">Hero</button>
              <button type="button" class="picker-toggle-btn" data-target="board">Board</button>
            </div>
          </div>
          <div id="card-grid"></div>

          <div class="picker-row">
            <span class="picker-row-label">Hero</span>
            <div class="preview-row" id="hero-preview"></div>
          </div>
          <span class="error" id="hero-error"></span>

          <div class="picker-row">
            <span class="picker-row-label">Board <span class="hint">(optional)</span></span>
            <div class="preview-row" id="board-preview"></div>
          </div>
          <span class="error" id="board-error"></span>
        </div>

        <div class="field villains">
          <div class="villains-label-row">
            <label>Villains</label>
            <button type="button" id="add-villain" class="chip-btn">+ villain</button>
          </div>
          <div class="villain-tabs" id="villain-tabs"></div>
          <div id="range-editor"></div>
          <span class="error" id="villain-error"></span>
        </div>

        <button type="submit" id="submit-btn" class="primary-btn">Calculate equity</button>
      </form>

      <section id="result" class="result hidden" aria-live="polite">
        <div class="stat">
          <span class="stat-label">Win</span>
          <span class="stat-value" id="stat-win">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Loss</span>
          <span class="stat-value" id="stat-loss">-</span>
        </div>
        <div class="stat">
          <span class="stat-label">Tie</span>
          <span class="stat-value" id="stat-tie">-</span>
        </div>
        <div class="stat highlight">
          <span class="stat-label">Equity</span>
          <span class="stat-value" id="stat-equity">-</span>
        </div>
        <div class="meta">
          <span id="stat-sims"></span>
          <span id="stat-cache" class="badge hidden">from cache</span>
        </div>
      </section>

      <div id="api-error" class="api-error hidden" role="alert"></div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
